version: "3.9"

services:
  posta:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:5001"   # HTTP API
      - "25:25"       # SMTP
    volumes:
      - posta-data:/data
      - ./config/posta:/app/config/posta:ro
    environment:
      - POSTA_MAIN_DB_PATH=/data/posta-main.db
      - POSTA_MESSAGE_DB_DIRECTORY=/data/message-db
      - PORT=5001
      - SMTP_PORT=25
      - POSTA_CONFIG_FILE_PATH=/app/config/posta/posta.yml
      - POSTA_LOG_LEVEL=info
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      - CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET:-}
    restart: unless-stopped

  # PostgreSQL is NOT needed — SQLite is built into Bun

volumes:
  posta-data:
