[package]
name = "millionsend"
version = "0.8.0"
edition = "2021"
rust-version = "1.70"
description = "Official Rust SDK for MillionSend — a self-hostable, Resend-compatible email API."
license = "MIT"
repository = "https://github.com/MillionSend/millionsend-rust"
homepage = "https://github.com/MillionSend"
readme = "README.md"
keywords = ["email", "millionsend", "ses", "resend"]
categories = ["email", "api-bindings"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
