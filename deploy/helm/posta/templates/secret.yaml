{{- if not .Values.secret.existingSecret }}
{{- range $key := list "DATABASE_URL" "MASTER_ENCRYPTION_KEY" "BETTER_AUTH_SECRET" }}
{{- $_ := required (printf "secret.values.%s is required (or name a Secret in secret.existingSecret)" $key) (get $.Values.secret.values $key) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "posta.fullname" . }}-env
  labels:
    {{- include "posta.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.values }}
  {{ $k }}: {{ toString $v | quote }}
  {{- end }}
{{- end }}
