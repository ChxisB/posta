---
name: CI
on: [push, pull_request]

jobs:
  typecheck-and-test:
    name: TypeCheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [typecheck-and-test]
    # Forks run CI too; only the canonical repo publishes the image.
    if: github.repository == 'ChxisB/posta' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/chxisb/posta:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
